    # --- the one definition restated in Challenge.lean ---
    - source: "The Z-set Z_{p/q}(s, s+t) ([FLP95] (1.4))"
      lean: "FLP.ZSet"
      module: "Challenge (statement), FLP.Basic (definition)"
      status: proved
      note: >-
        {ξ | 0 < ξ ∧ ∀ n, Int.fract (ξ (p/q)ⁿ) ∈ Set.Ico s (s+t)}, restated verbatim
        in Challenge.lean and the only definition the certified statements mention.
        A half-open window quietly turned closed, or the membership condition 0 < ξ
        swapped, is what comparator's statement match catches here. [Dub09AA]
        defines the same sets with ξ ≠ 0; the statements that hold in that
        generality say so explicitly and are phrased without ZSet.

    # --- load-bearing, not compared ---
    - source: "Prop. 2.1 ([Dub09AA] (3)): sₙ = pyₙ − qy_{n+1} − (p−q)ν, the carry word"
      lean: "Z32.carry_eq"
      module: "Z32.DubickasWord"
      status: proved
      note: "With Z32.orb, Z32.xInt, Z32.yFract, Z32.carry, the orbit and its word."
    - source: "Prop. 2.2 ([Dub09AA] (4)): the summation identity for x_{n+m}"
      lean: "Z32.xInt_add"
      module: "Z32.DubickasWord"
      status: proved
      note: "Accumulator Z32.geomAcc. Everything downstream telescopes against it."
    - source: "Prop. 2.3: the growth bound |xₙ| + C ≤ (|x₀| + C)(p/q)ⁿ"
      lean: "Z32.abs_xInt_le"
      module: "Z32.DubickasWord"
      status: proved
      note: "Applied with C = p rather than the source's 2p; see fidelity.divergences."
    - source: "Lem. 2.4 ([DN05] Lem. 2): the carry word is aperiodic"
      lean: "Z32.not_isEventuallyPeriodic_carry"
      module: "Z32.DubickasWord"
      status: proved
      note: >-
        The single analytic input of the development and the sole hypothesis of the
        block-certificate soundness theorem. Proved, not cited, for every coprime
        p > q > 1, every ξ ≠ 0 and every shift ν.
    - source: "Prop. 3.1: {t/m} = ((⌊t⌋ mod m) + {t})/m, and the residue/cell dictionary"
      lean: "Z32.fract_div_natCast, Z32.floor_emod_iff_fract_mem"
      module: "Z32.Dictionary"
      status: proved
      note: "What turns a statement about integer parts into one about confinement."
    - source: "Window monotonicity of the sets Z_{p/q}"
      lean: "Z32.ZSet_mono"
      module: "Z32.Dictionary"
      status: proved
      note: "Transfers emptiness from a certified window to every sub-window."
    - source: "Lem. 3.2 (the shift trick): eventual confinement gives genuine confinement"
      lean: "Z32.mem_ZSet_of_eventually"
      module: "Z32.Dictionary"
      status: proved
      note: "The orbit of ξ(p/q)ᴺ is the tail of the orbit of ξ; used in §5, §6 and §7 alike."
    - source: "Prop. 4.1 ([FLP95] Thms. 3.2, 3.4 combined at 3/2)"
      lean: "Z32.ZSet_third_empty_of_escape"
      module: "Z32.EscapeCert"
      status: proved
      note: "If the orbit of 0 under f_{3/2,s} reaches [2/3,1), then Z_{3/2}(s,s+1/3) = ∅."
    - source: "[FLP95] Thm. 3.2: finitely many survivors forces the Z-set empty"
      lean: "FLP.ZSet_eq_empty_of_survivors_finite"
      module: "FLP.ZEmpty"
      status: proved
      note: "Through the T-map decoupling of FLP/Decoupling.lean and FLP/TExpansion.lean."
    - source: "[FLP95] Thm. 3.4: the survivor set is finite once the origin escapes"
      lean: "FLP.survivors_finite"
      module: "FLP.SurvivorFinite"
      status: proved
      note: "The cylinder/straddle counting argument; the exact-N trichotomy reproduces."
    - source: "[FLP95] Cor. 1.4a at s = 0, credited there to Pollington"
      lean: "FLP.ZSet_empty_zero"
      module: "FLP.ParamDensity"
      status: proved
      note: >-
        The fixed point of f_{3/2,0} admits no escape witness, so this case goes
        through the endpoint analysis of the survivor set at α = 0. The same file
        carries FLP.ZSet_empty_dense, emptiness at a dense set of positions.
    - source: "Table 1: the four escape computations"
      lean: "Z32.escape_one_sixth, Z32.escape_one_third, Z32.escape_one_half, Z32.escape_two_thirds"
      module: "Z32.EscapeCert"
      status: proved
      note: "Exact rational arithmetic through FLP.lmo_of_lt / FLP.lmo_of_ge; escape times 3, 2, 3, 1."
    - source: "Lem. 5.1 (covering): every cell of every modulus m ≥ 3 sits in one of the five windows"
      lean: "Z32.exists_grid_window"
      module: "Z32.ResidueCapture"
      status: proved
      note: "The tight cases are m = 3, where each cell is a window, and m = 4 at r = 1, 3."
    - source: "Prop. 5.2: Z_{3/2}(r/m, (r+1)/m) = ∅ for m ≥ 3"
      lean: "Z32.ZSet_cell_empty, Z32.ZSet_cell_empty_int"
      module: "Z32.ResidueCapture"
      status: proved
      note: "Lemma 5.1 plus window monotonicity."
    - source: "Lem. 6.1 (after [Lot02] Prop. 2.1.3, Thm. 2.1.5): no bispecial pair implies Sturmian"
      lean: "isSturmian_of_not_hasBispecialPair"
      module: "ForMathlib.Combinatorics.Sturmian"
      status: proved
      note: >-
        With the definitions IsSturmian and HasBispecialPair, and the pigeonhole
        consequence exists_factor_eq_of_isSturmian. Only the direction the proof
        needs, by uniqueness of the right special factor.
    - source: "The Morse–Hedlund floor p(w,m) ≥ m+1 for aperiodic words ([MH38])"
      lean: "succ_le_pComplexity, pComplexity_lt_succ_of_not_isEventuallyPeriodic"
      module: "ForMathlib.Combinatorics.Sturmian, ForMathlib.Combinatorics.InfiniteComplexity"
      status: proved
      note: "With the factor complexity pComplexity. Shared byte for byte with two sibling repositories."
    - source: "Lem. 6.2 ([Dub09AA] Thm. 3, alphabet): confinement forces sₙ ∈ {k, k+1}"
      lean: "Z32.carry_mem_alphabet"
      module: "Z32.SmallInterval"
      status: proved
      note: "With the explicit k = ⌈(p−q)s − q/p⌉ (letter Z32.letterBase), where the source says 'for some k'."
    - source: "Rem. 6.3: the sharper bound |sₙ| ≤ p"
      lean: "Z32.abs_carry_le"
      module: "Z32.SmallInterval"
      status: proved
      note: "Sharper than the |sₙ| < 2p read off from the alphabet in [Dub09AA] §3."
    - source: "Lem. 6.4 (no bispecial pair) — the arithmetic heart of [Dub09AA] Thm. 3"
      lean: "Z32.not_hasBispecialPair"
      module: "Z32.SmallInterval"
      status: proved
      note: "The telescoped difference forces ((p/q)^{M−1}+1)/q ≤ ((p/q)^M+1)/p, i.e. p ≤ q."
    - source: "Thm. 6.5 ([Dub09AA] Thm. 3): the carry word is Sturmian"
      lean: "Z32.isSturmian_carryBit"
      module: "Z32.SmallInterval"
      status: proved
      note: "Two letters (Lem. 6.2), aperiodic (Lem. 2.4), no bispecial pair (Lem. 6.4)."
    - source: "Lem. 6.6: the integer parts are eventually injective"
      lean: "Z32.exists_xInt_injective"
      module: "Z32.SmallInterval"
      status: proved
      note: "Consecutive orbit points eventually differ by more than 1."
    - source: "Thm. 6.7: no orbit is confined to the closed window [s, s+1/p] when p < q²"
      lean: "Z32.no_confinement"
      module: "Z32.SmallInterval"
      status: proved
      note: >-
        The counting endgame: two equal factors of length m give q^m | x_j − x_i ≠ 0,
        against the growth bound, and Bernoulli's inequality closes it where the
        source extracts mth roots.
    - source: "Def. 7.1 and Algorithm 1: the block certificate and the Boolean the kernel evaluates"
      lean: "Z32.BlockCert.Cert, Z32.BlockCert.Cert.ok"
      module: "Z32.BlockCert"
      status: proved
      note: >-
        With carries/carriesFrom (the p+q−1 carry letters), pieceA, pieceC,
        pieceOk, levelOk, funnelOk for condition (F), hits, outEdges, rank, funcOk
        for condition (D), and leMax, minLe, rle, rleR for the expanded comparisons.
        Every check is an inequality between integers over one common denominator.
    - source: "Thm. 7.2 (soundness): a valid certificate refutes confinement and eventual confinement"
      lean: "Z32.BlockCert.Cert.not_confined, Z32.BlockCert.Cert.not_eventually_confined"
      module: "Z32.BlockCert"
      status: proved
      note: >-
        Via Cert.exists_block_path: condition (F) pushes the orbit into the blocks,
        condition (D) makes the block itinerary eventually deterministic hence
        eventually periodic, and an eventually periodic carry word contradicts
        Lemma 2.4. Nothing counts survivors, uses the sign of ξ, or compares p with
        q². The Z-set and single-window bridges are
        Z32.BlockCert.ZSet_eq_empty_of_cert, not_eventually_mem_Ico_of_cert and
        ZSet_eq_empty_of_window.
    - source: "Rem. 7.3: the checks have teeth"
      lean: "Z32.BlockCert.ok_eq_false_of_full, ok_eq_false_of_full_closed, ok_eq_false_of_not_coprime"
      module: "Z32.BlockCert"
      status: proved
      note: >-
