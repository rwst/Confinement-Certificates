    - source: "Theorem C (Thm. 7.11): a certified-empty union of total length 25/36"
      lean: "Z32.union_record_empty"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: "Certificate certUnion2536: six intervals, funnel depth 11, seventeen blocks."
    - source: "Theorem C (Thm. 7.12), the record: the eleven-interval union of total length 17/24"
      lean: "Z32.union_record_7083_empty"
      module: "Challenge (statement), SolutionRecord / Z32.UnionRecord (proof)"
      status: proved
      note: >-
        Certificate certUnion7083: D = 48·3¹⁷ = 6 198 727 824 (the largest
