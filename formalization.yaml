fidelity:
  divergences: >-
    The formalization follows the paper's own proofs. Where names and wording part company, the paper
    records it. Appendix A notes two Lean names that predate the paper's wording:
    Z32.SchemaCertifiedK — the "certifiedK" of the file — is Definition 3.3's
    "s escapes at depth K", and "two_cell" throughout Z32/ is the two-interval
    union [0, 1/5) ∪ [4/5, 1) of Theorem 5.10's first entry. Lemma names follow
    the development, not the paper's numbering.
    One entry of Appendix A's tables gives a name that does not resolve: Table 1
    row 6 is listed as Z32.BlockCert.escape_union_7083, but the declaration sits
    after `end Z32.BlockCert` in Z32/UnionRecord.lean and is Z32.escape_union_7083.
    comparator2.json uses the real name.
    §3.3 states the correspondence with the literature and is used nowhere in the
    development: Definition 3.3 is the finiteness criterion of [FLP95, Thm. 3.4]
    together with the returning case of [Bug04, Lem. 1]; Proposition 3.4 is the
    cyclic permutation of [Bug04, Prop. 1]; and the interval (4) is J¹_{K+1}(q/p)
    in the notation of [Bug04, Lem. 3]. Theorems 3.5 and 3.6 are therefore a
    machine-checked fragment of [Bug04, Thm. 1], not an improvement of it; what
    the formalization adds is that the criterion is proved uniformly in
    (p, q, s, K) with no computation on concrete data, and that Definition 3.3 is
    identified with the funnel depth of a block certificate, which is what lets
    §4 treat the two on the same footing.
    Theorem 4.4 is stated in two rows with different offsets, δ = 0 for a schema
    position and δ = K for a certificate, because the two halves have different
    hypotheses; the paper explains the asymmetry rather than smoothing it. Both
    logarithms of Definition 4.1 are necessary, and Remark 4.6 exhibits the
    entry of Table 1 that shows it. Remark 4.7 records why a ranked certificate
    admits no bound at all, so the one entry of [Ste26] excluded from Table 1 is
    the ranked certDub08 replicating [Dub08, Cor. 1.2].
    Theorem 5.10's first entry is subsumed as a statement — Remark 5.12 notes
    that [Ste26, Thm. 7.14] already gives ‖ξ(3/2)ⁿ‖ ≥ 0.238 for some n, and
    ‖y‖ ≤ 1/5 implies ‖y‖ < 0.238 — and is kept for the certificate, not for the
    statement: the point of the entry is that a *ranked* certificate exists at
    depth one for a set whose hold set is infinite, exactly the configuration
    Corollary 5.9 shows an unranked one cannot have.
    Theorem 6.3 is not a competitive estimate for one set: Example 6.5 measures
    the slack on the 25/36 record at a factor of about thirteen (bound
    δ ≥ 1/44 against the true hole 11/36). What it asserts is that the slack
    closes as δ → 0, which is the sense in which it prices [KK17, Prob. 6.1].
    Theorem 7.1 falls 6.7·10⁻⁵ short of the printed constant of [Dub06, Cor. 1]
    and does not close the gap; §7.1 explains why no member of the family can,
    and Conjecture 7.2 — the period-doubling cascade behind that ceiling — is
    stated as a conjecture and left unformalized, being the outcome of an exact
    rational computation checked against a complete enumeration of the periodic
    orbits of period at most 20.

sources:
  - title: "Confinement schemas and the reach of block certificates for powers of rational numbers modulo one"
    authors: ["Ralf Stephan"]
    type: paper
    location: "paper2.pdf in this repository; Theorems A, B, C, D, E; Theorems 3.5, 3.6, 4.4, 5.5, 5.7, 6.3, 7.1 and Corollaries 3.7, 3.9, 3.11, 4.5, 5.9, 6.4"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The source of record, dated 8 September 2026. Paper and formalization come
      from the same collaboration and were developed together; Appendix A of the
      paper indexes every statement by Lean identifier, file and status,
      including the load-bearing ones that are not separately compared. The
      forty-one compared declarations are the statements phrased in Mathlib
      vocabulary alone; the statements quantified over the certificate format are
      proved but not compared, and Challenge2.lean lists them. Novelty is
      recorded as unknown: §3.3 positions Theorems 3.5 and 3.6 explicitly as a
      machine-checked fragment of [Bug04, Thm. 1] rather than as new mathematics,
      and a full prior-art gate was performed.

  - title: "Confinement certificates for powers of rational numbers modulo one"
    authors: ["Ralf Stephan"]
    type: paper
    id: "https://doi.org/10.13140/RG.2.2.36190.19520"
    location: "Thms. 7.2, 7.8, 7.9, 7.11, 7.12, 7.14, 7.17, §7.4; Tables 2 and 3"
    relationship: background
    author_endorsement: participated
    note: >-
      The corpus this paper reasons about, by the same author, formalized in the
      same repository and compared by comparator.json. Its soundness theorem
      (Thm. 7.2, Z32.BlockCert.Cert.not_confined) is the input to §4 and the
      thing §5 proves a converse of; its thirty depth-one certificates of
      Thm. 7.17 are what Corollary 3.7 replaces by one criterion; its nine
      unranked certificates are the rows of Table 1, made effective; its
      certUnion2536 is Example 6.5; and its refusal of the closed two-cell arc to
      depth 60 — a bounded search — becomes Corollary 5.9. Nothing is assumed
      from it: every statement it supplies is a theorem in this repository.

  - title: "On the range of fractional parts {ξ(p/q)ⁿ}"
    authors: ["Leopold Flatto", "Jeffrey C. Lagarias", "Andrew D. Pollington"]
    type: paper
    location: "Acta Arith. 70 (1995), 125–147; (1.4), Thm. 3.4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Defines the sets Z_{p/q}(s, s+t), whose definition FLP.ZSet restates
      verbatim in Challenge2.lean. Theorem 3.4 — for N least with f^N(0) ≥ 1/β
      the survivor set has exactly N elements, cyclically permuted — is the
      finiteness criterion that §3.3 identifies with Definition 3.3's escape data.
      Not assumed: the identification is commentary, used nowhere in the proofs,
      and the [FLP95] material this repository does formalize lives in FLP/ and
      belongs to the first paper.

  - title: "Linear mod one transformations and the distribution of fractional parts {ξ(p/q)ⁿ}"
    authors: ["Yann Bugeaud"]
    type: paper
    location: "Acta Arith. 114 (2004), 301–311; Thms. 1 and 3, Lems. 1–3, Prop. 1, §2–§3"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The nearest thing in print to §3, and the paper says so: Theorem 1 gives
      Z_{p/q}(s, s+1/p) = ∅ for a set of s of full Lebesgue measure with an
      explicit criterion, Theorem 3 that the exceptional set is null,
      uncountable and not closed. Proposition 3.4 is the cyclic permutation of
      its Proposition 1, and the depth-K interval (4) is its J¹_{K+1}(q/p).
      Nothing is assumed from it; Theorems 3.5 and 3.6 are a machine-checked
      fragment of its Theorem 1, proved from the aperiodicity lemma alone.

  - title: "Powers of a rational number modulo 1 cannot lie in a small interval"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "Acta Arith. 137 (2009), 233–239; Thms. 1 and 3, (2), (3), §2–§4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Supplies the notation of §2 — the orbit xₙ, yₙ, the carry word sₙ and the
      recursion qy_{n+1} = pyₙ + θ − sₙ, formalized as Z32.orb, Z32.yFract,
      Z32.carry and Z32.q_mul_yFract_succ — and the alphabet argument that
      Lemma 3.2 restates around ⌊θ⌋. Its §4 leaves the length-1/p statement open
      for p > q², which is the regime Corollaries 3.7, 3.9, 3.11 and
      Theorem 3.10 live in. Its Theorem 1 itself is proved in this repository
      (Z32.dubickas_theorem_1, first paper), so nothing is cited as an axiom.

  - title: "Integer parts of powers of rational numbers"
    authors: ["Arturas Dubickas", "Aivaras Novikas"]
    type: paper
    location: "Math. Z. 251 (2005), 635–648; Lem. 2"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The aperiodicity of the carry word (Lemma 2.1 of the paper) — the single
      analytic input of the whole development, and the only thing every
      emptiness statement here rests on, through the periodicity contradiction.
      Proved rather than cited, as Z32.not_isEventuallyPeriodic_carry in
      Z32/DubickasWord.lean, so no certified statement carries a literature
      axiom. Theorem 4.2 is its dichotomy made quantitative.

  - title: "On the powers of 3/2 and other rational numbers"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "Math. Nachr. 281 (2008), no. 7, 951–958; Cor. 1.2"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The closed union of total length 20/39, replicated in [Ste26] by a ranked
      certificate. It is the one entry of that corpus Theorem 4.4 cannot make
      effective, and Remark 4.7 explains why the obstruction is a property of
      rank strata rather than a gap in the proof: a ranked block may carry an
      equal-rank edge and a lower-rank one, so a model orbit can follow an
      equal-rank cycle arbitrarily long before dropping.

  - title: "Cellular automata and powers of p/q"
    authors: ["Jarkko Kari", "Johan Kopra"]
    type: paper
    location: "RAIRO Theor. Inform. Appl. 51 (2017), 191–204; Cor. 4.8, Thm. 5.9, Prob. 6.1"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Problem 6.1 asks for explicit empty unions of total length 1 − ε for every
      ε, their Theorem 5.9 proving non-constructively that such unions exist.
      Theorem 6.3 is a negative answer for this certificate format: driving the
      hole δ to 0 costs depth or blocks like 1/δ, so a parametric certificate of
      bounded shape valid for every P does not exist. Nothing is assumed from
      the paper.

  - title: "The set of rational cycles for the 3x + 1 problem"
    authors: ["Jeffrey C. Lagarias"]
    type: paper
    location: "Acta Arith. 56 (1990), 33–53; Thm. 2.1"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The shape of the periodic points that Propositions 5.3 and 5.4 pin down at
      a general coprime base: the P-periodic points of the model relation in
      [0,1) are exactly the A/(p^P − q^P) with 0 ≤ A < p^P − q^P. Proved here
      (Z32.cyclePoint_eq_base with Z32.cycOrbit_period_dvd), not cited; [Ste26]
      had it at 3/2 only.

  - title: "Applied Proof Theory: Proof Interpretations and their Use in Mathematics"
    authors: ["Ulrich Kohlenbach"]
    type: book
    location: "Springer Monographs in Mathematics, Springer, Berlin, 2008; §2"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The sense in which §4 extracts a rate: every emptiness proof in this
      corpus is a proof by contradiction from aperiodicity and so says nothing
      about when an orbit leaves, yet a bound is latent in it. Methodological
      reference only; nothing is formalized from it.

  - title: "On the distance from a rational power to the nearest integer"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "J. Number Theory 117 (2006), 222–239; Cor. 1, (1)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The exact ceiling of the whole certificate family, and the reason
      Theorem 7.1 stops where it does. Corollary 1 gives every ξ ≠ 0 a limit
      point of (‖ξ(3/2)ⁿ‖)ₙ at least (3 − T(2/3))/12 = 0.238117… and at most
      (1 + T(2/3))/4 = 0.285647…, with T(z) = ∏_{m≥0}(1 − z^{2^m}). Theorem 7.1's
      2/7 = 0.285714… misses the second by 6.7·10⁻⁵ and [Ste26, Thm. 7.14]'s
      0.238 misses the first by 1.2·10⁻⁴; §7.1 identifies both constants as the
      accumulation points of the method's own obstruction. Not formalized:
      Conjecture 7.2 is the unproved half of that identification.

  - title: "Fractional parts of powers of large rational numbers"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "Discrete Math. 342 (2019), no. 7, 1949–1955; Thms. 1.1, 1.2"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The printed single-window record that Theorem 7.1 passes: 31/81 =
      0.38271… at the base 3/2, against 3/7 = 0.428571… here. Theorem 1.1
      settles the regime p > q² at every position for algebraic ξ ≠ 0, which is
      what makes Corollary 3.11 — the same regime for a continuum of positions
      and every real ξ ≠ 0 — a statement the certificate scheme could not reach.
      Nothing is assumed from it.

  - title: "Progressions arithmétiques généralisées et le problème des (3/2)ⁿ"
    authors: ["Andrew D. Pollington"]
    type: paper
    location: "C. R. Acad. Sci. Paris Sér. I 292 (1981), 383–384"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      Exhibits ξ ≠ 0 with ‖ξ(3/2)ⁿ‖ > 4/65 for every n, one end of the interval
      in which the optimal nearest-integer constant lies. Quoted in §7.1 to fix
      how much room a different method would have; not formalized and not used.

  - title: "Powers of rationals modulo 1 and rational base number systems"
    authors: ["Shigeki Akiyama", "Christiane Frougny", "Jacques Sakarovitch"]
    type: paper
    location: "Israel J. Math. 168 (2008), 53–91"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Exhibits ξ ≠ 0 with ‖ξ(3/2)ⁿ‖ < 1/3 for every n, the other end of that
      interval. Quoted in §7.1 for the same purpose; not formalized and not used.

  - title: "On the Diophantine nature of the elements of Cantor sets arising in the dynamics of contracted rotations"
    authors: ["Yann Bugeaud", "Dong Han Kim", "Michel Laurent", "Arnaldo Nogueira"]
    type: paper
    location: "Ann. Sc. Norm. Super. Pisa Cl. Sci. (2021), arXiv:2001.00380; Def. 1"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Names the contracted rotation T_{γ,α}(x) = {γx + α} that Proposition 3.4
      identifies the rank function with, and shows the exceptional set of
      [Bug04, Thm. 1] to consist of transcendental numbers — which is why the
      positions §3 does not reach are, in the footnote of §3.3, a null
      uncountable set of transcendental ε. Commentary only; not formalized.

  - title: "An unsolved problem on the powers of 3/2"
    authors: ["Kurt Mahler"]
    type: paper
    location: "J. Austral. Math. Soc. 8 (1968), 313–321"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      The origin of the sets: whether Z_{3/2}(0, 1/2) is empty. Nothing here
      touches it; the longest single window certified is 3/7 = 0.428571… < 1/2.

automation:
  methods:
    - method: agent
      models: ["claude-fable-5"]
      framework: "Claude Code"
      role: >-
        Mathematical discovery, and the drafting of the paper.
    - method: agent
      models: ["claude-opus-4-8"]
      framework: "Claude Code"
      role: >-
        Formalization and tooling.
    - method: manual
      models: []
      role: >-
        Direction, review, and authorship of the paper. The author chose the
        problem, set the targets and the hygiene gates (std3, no cited axiom, no
        native_decide), steered the work turn by turn, reviewed every statement
        against the paper, and takes sole responsibility for the mathematical
        content.
  spend_usd: "subscription-based usage ($100/month subscription; no separate API spend)"
  notes: >-
    The checks of the first paper still ship with the repository and still
    apply to the certificates this one reuses: the four independent engines
    (atlas.c, hold.c, gridcert.c and the naive Python verify_atlas.py, all in
    exact integer or rational arithmetic, no floating point anywhere), and
    Z32/reproduce.sh, which regenerates every certificate with gencert.py and
    requires the result to be byte identical to the Lean definition, and which
    runs the generator against five sets known to be NONEMPTY in print and
    requires it to refuse every one.
    Two things are specific to this paper. The certificates it adds — the five
    closed-endpoint ones of Theorem 5.10 and the rank-stratified certTwoSeven of
    Theorem 7.1 — are generated by the same `Z32/gencert.py` invocations
    recorded in their docstrings, so the same byte-identity check covers them.
    And §3 is the section with no certificates at all: its proofs are uniform in
    (p, q, s, K) with no computation on concrete data, which is why Appendix A
    marks no row of §3 "computed" and why Theorem 3.10 reproduces thirty
    kernel-checked certificates of [Ste26] as thirty specialisations of one
    theorem instead.
    `lake test` runs leanprover/comparator on comparator.json and
    comparator2.json, each of which re-derives the axiom list from a kernel
    replay of a fresh export of both the challenge and the solution. Wall time
    and hardware were not recorded, except for the union record behind Table 1
    row 6, whose kernel check alone costs about 100 seconds and 12 gigabytes;
    the development isolates it in Z32/UnionRecord.lean so that nothing else
    pays that. comparator2.json names SolutionRecord2 rather than Solution2, that
    row being among the statements it certifies, so a `lake test` run pays the
    cost once per config.

review:
  status: self-assessed
  reviewers:
    - "Ralf Stephan"
  notes: >-
    The author directed the work and checked the statements against the paper.
    No external review of this paper is recorded.

limitations:
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound and
    nothing else, confirmed with #print axioms. There is no sorry outside the
    deliberate placeholders in Challenge2.lean, no project-defined axiom and no
    native_decide; every block certificate is discharged by `by decide`, so the
    comparator's kernel replay re-evaluates it from raw integer data.
    Challenge2.lean restates fifteen definitions — FLP.ZSet, the orbit Z32.orb
    and Z32.yFract, the schema parameters Z32.schemaTheta and Z32.schemaEps, the
    predicates Z32.SchemaCertified, Z32.Escape, Z32.SchemaCertifiedK and
    Z32.LowBand, the budget Z32.escapeSteps, Z32.HasDenom, Z32.CoprimeDenom,
    Z32.holdSet, and the funnel Z32.pre and Z32.funnel — and fixes no definition
    holes, so no compared statement can be hollowed out by a definition value
    supplied elsewhere.
  - >-
    Three groups of the paper's statements are proved but not compared, because
    restating them would mean re-declaring Z32.BlockCert.Cert and its Bool-valued
    checker Cert.ok inside the challenge: Theorem 4.2 with Proposition 4.3(ii)
    and Theorem 4.4 row two; Theorems 5.6, 5.7, 5.8 and Corollary 5.9; and
    Corollary 6.4 with Example 6.5. Their consequences on concrete real sets are
    compared instead — Table 1, Corollary 4.5, Theorem 5.10, Theorem 7.1 — so
    what a reader of Challenge2.lean alone does not see verified is exactly the
    reach statements about the format, including Theorem D(ii). This is a
    deliberate trade: the first paper's challenge quantified the apparatus away
    entirely, and this one cannot, because half its results are about the
    apparatus.
  - >-
    Novelty is limited and the paper says where. §3.3 states outright that
    Theorems 3.5 and 3.6 are a machine-checked fragment of [Bug04, Thm. 1], not
    an improvement of it, and that the mathematics of §3 is not new; what is new
    there is uniformity in (p, q, s, K), the identification of Definition 3.3
    with certificate funnel depth, and the continuum statements of
    Corollary 3.11 in a regime where [Dub19] needs ξ algebraic. No systematic
    prior-art gate is documented in this repository.
  - >-
    Not formalized: Conjecture 7.2 and Remark 7.3 (marked as such in Appendix A),
    and the measurements. Remark 6.6's search records — unions of total length
    179/240, 3/4 and 181/240 = 0.754167… at depth 29 with 2801 blocks — are
    engine output, explicitly "records on the curve of [KK17, Prob. 6.1], not a
    solution of it", and nothing in the development depends on them; likewise the
    count of 213 of 236 certified frontier positions in §7 and the 531 292-orbit
    census behind Remark 6.6's reading of Theorem 5.8.
  - >-
    The kernel and the search still part company, now at 3/7 for single windows
    and 17/24 for unions. Theorem 6.3 says the gap to [KK17, Prob. 6.1] cannot
    be closed in this format at all; it does not say what format would close it.
    Theorem 7.1 falls 6.7·10⁻⁵ short of the printed constant of [Dub06, Cor. 1]
    and §7.1 argues no member of this family reaches it, but that argument rests
    on Conjecture 7.2, which is unproved. How much better a different method
    could do is wide open: §7.1 records only that the two optimal constants of
    this shape lie in [4/65, 0.285647…] and [0.238117…, 1/3], from [Pol81] and
    [AFS08].
  - >-
    Mahler's problem stays open, and with it everything at window length 1/2.
  - >-
    The repository proves more than comparator2.json compares, and more than
    either paper uses. comparator.json compares the twenty-four statements of the
    first paper against Challenge.lean and SolutionRecord; FLP/ carries the
    [FLP95] 1/3-spread theorem itself (FLP.spread_lower_bound,
    FLP.three_halves_spread), which neither paper uses; and six Z32 modules
    belong to other plans entirely — EscapeLadder.lean, VisitDensity.lean,
    ModelEntropy.lean, DyadicOrbit.lean, PairStatistics.lean and
    BalanceVectors.lean. All are std3 and sorry-free, none is named in
    comparator2.json, and no compared statement depends on any of them.

alignment:
  namespace: "Z32"
  # The only definition outside Z32 that the certified statements mention is
  # FLP.ZSet, in namespace FLP; the word-combinatorics infrastructure in
  # ForMathlib/ is in the root namespace and is not reached from here.
  statements:
    # --- §3: the schema and the rotation (forty-one compared, seventeen here) ---
    - source: "Theorem A (Thm. 3.5): Z_{p/q}(s, s+1/p) = ∅ whenever s escapes at depth K"
      lean: "Z32.ZSet_eq_empty_of_certifiedK"
      module: "Challenge2 (statement), Solution2 / Z32.DepthKSchema (proof)"
      status: proved
      note: >-
        The hypothesis is Z32.SchemaCertifiedK p q s K, i.e. Definition 3.3's
        escape data for ε = {(p−q)s}. Uniform in (p, q, s, K), with no
        computation on concrete data and no assumption on the arithmetic nature
        of ξ. The mechanism is the rotation of Proposition 3.4: the K+1 marked
        points cut the window into K+1 arcs, the map permutes them cyclically,
        so the rank sequence is eventually periodic, and the branch — hence the
        carry letter — is a function of the rank.
    - source: "Theorem A (Thm. 3.6), closed form: the all-low escape data, as two inequalities in ε"
      lean: "Z32.ZSet_eq_empty_of_lowBand"
      module: "Challenge2 (statement), Solution2 / Z32.DepthKSchema (proof)"
      status: proved
      note: >-
        Z32.LowBand is display (4): q^{K+1}(p−q) ≤ pε(p^{K+1} − q^{K+1}) and
        ε(p^{K+1} − q^{K+1}) ≤ q^K(p−q). Sufficient for depth K and not
        necessary — Definition 3.3 permits any branch word — since the other
        words cut the cells indexed by rotation number rather than by depth.
        With Z32.lowOrbit and Z32.lowOrbit_add_eq for the closed form of wᵢ.
    - source: "Theorem B (Cor. 3.7), the certificate schema: ε = 0, or q ≤ pε, or q² ≤ p(p+q)ε and (p+q)ε ≤ q"
      lean: "Z32.ZSet_eq_empty_of_certified"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: >-
        The K ≤ 1 case of Theorem A together with the degenerate ε = 0, written
        with denominators cleared (Z32.SchemaCertified). It is what the thirty
        depth-one certificates of [Ste26, Thm. 7.17] collapse into, and it
        settles positions of measure 1 − 2q²/(p(p+q)) at every base. The
        excluded ε form the two open intervals of Corollary 3.8, of total length
        2q²/(p(p+q)); that corollary is immediate arithmetic from the display and
        has no Lean identifier. Z32.certifiedK_of_certified is the bridge back to
        Theorem A.
    - source: "Corollary 3.9(i): Z_{p/q}(0, 1/p) = ∅ at every coprime base p > q > 1"
      lean: "Z32.ZSet_zero_eq_empty"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: "The ε = 0 clause at s = 0."
    - source: "Corollary 3.9(i): every position with (p − q)s ∈ ℤ is certified"
      lean: "Z32.ZSet_eq_empty_of_theta_int"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: "At the base 3/2 these are the halves, at 10/3 the sevenths."
    - source: "Corollary 3.9(ii): Z_{p/q}(1/2, 1/2 + 1/p) = ∅ when p − q is even or 2q ≤ p"
      lean: "Z32.ZSet_half_eq_empty"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: >-
        The remaining case — p − q odd and p < 2q — is genuinely outside the
        depth-one schema; its smallest instance is (p,q) = (4,3), for which
        [Ste26] needs a certificate of funnel depth 26.
    - source: "Theorem 3.10: six positions s = j/6 at the base 5/2"
      lean: "Z32.ZSet_five_two"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: >-
        [Ste26, Thm. 7.17] verbatim, but as six specialisations of
        Corollary 3.7, each supplying only a decomposition (p−q)s = m + ε — no
        certificate data and no kernel evaluation. Appendix A marks no row of §3
        "computed" for exactly this reason.
    - source: "Theorem 3.10: six positions at the base 7/2"
      lean: "Z32.ZSet_seven_two"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: "The entry at s = 5/6 is a band case: ε = 1/6 lies in [4/63, 2/9]."
    - source: "Theorem 3.10: six positions at the base 9/2"
      lean: "Z32.ZSet_nine_two"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: "The entry at s = 1/6 is a band case: ε = 1/6 lies in [4/99, 2/11]."
    - source: "Theorem 3.10: six positions at the base 10/3"
      lean: "Z32.ZSet_ten_three"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
