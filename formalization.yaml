    - source: "Table 1 row 1: [1/6, 13/24) is left within 14 + α steps, 2^α ≥ X(3/2)³ + 1"
      lean: "Z32.BlockCert.escape_sixth_3_8"
      module: "Challenge2 (statement), Solution2 / Z32.EscapeBound (proof)"
