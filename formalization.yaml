    - source: "Corollary 3.11, depth 0: every real s at the base 5/2 with {3s} ≥ 2/5"
      lean: "Z32.ZSet_five_two_upper"
      module: "Challenge2 (statement), Solution2 / Z32.SymbolicCert (proof)"
      status: proved
      note: >-
        A continuum of positions, rational or not, in the regime p > q² where
        [Dub09AA, §4] leaves the question open and [Dub19, Thm. 1.1] settles it
