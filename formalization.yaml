version: "v0.4"

project:
  name: "Confinement schemas and the reach of block certificates for powers of rational numbers modulo one"
  description: >-
    A Lean 4 / Mathlib development of the second paper on the sets
    Z_{p/q}(s, s+t) = {ξ > 0 : {ξ(p/q)ⁿ} ∈ [s, s+t) for all n ≥ 0}, the
    generalized Z-numbers of Flatto, Lagarias and Pollington. The first paper
    built a corpus of block certificates for individual statements
    Z_{p/q}(U) = ∅. This paper replaces parts of that corpus by theorems, and
    then asks what the certificate format can and cannot reach.
    Thirty certificates in the regime p > q² collapse into one closed-form
    criterion on the single real parameter ε = {(p−q)s}, settling a set of
    positions of measure 1 − 2q²/(p(p+q)) at every base and for every real
    ξ ≠ 0; the criterion extends to a family indexed by a depth K, identified
    with the finiteness criterion of [FLP95] and with the parameter intervals
    J¹_b of [Bug04], the depth playing the role of the denominator of the
    rotation number. An explicit escape time for L ≤ ξ ≤ X is extracted from the
    soundness proof, and every unranked certificate of [Ste26] is made effective
    by it. A completeness theorem says the verdict is forced on the class where a
    certificate can exist — a finite hold set — and that an infinite hold set
    refuses every unranked certificate at every depth and over every denominator,
    which turns a bounded computer search into a theorem. A measure-theoretic
    depth–size bound 1 ≤ 2δ(K + 2 + log_{p/q} 2B) prices [KK17, Prob. 6.1] for
    this format. Finally a rank-stratified certificate gives
    ‖ξ(3/2)ⁿ‖ < 2/7 = 0.285714… infinitely often for every ξ ≠ 0, past the
    31/81 = 0.38271… of [Dub19] as a window and past the corpus's own 1/3 as a
    nearest-integer constant.
  authors:
    # Contributor roles for the formalization, not a bibliographic byline; the
    # paper's byline is recorded under sources.
    - "Ralf Stephan (direction, review, paper author)"
    - "Claude Code, claude-fable-5 (mathematical discovery, paper drafting)"
    - "Claude Code, claude-opus-5 (formalization)"
  license: "CC0-1.0"
  responsible_maintainers:
    - "Ralf Stephan"

repository:
  role: substantive-development

classification:
  arxiv: [math.NT, math.DS]
  msc2020: ["11J71", "11K06", "37E05"]

status:
  scope: >-
    Complete for every numbered statement of the paper except two: Appendix A is
    a table of every statement with its Lean identifier, its file and its status,
    and every row is proved at std3 — no sorry, no cited axiom admitted as an
    axiom, no natively compiled decision procedure. The two exceptions are marked
    "not formalized" in the table itself: Conjecture 7.2 (the period-doubling
    cascade and its closed form for the entry points c_k) and Remark 7.3, which
    reads that cascade back off the transient tree. Corollary 3.8 has no Lean
    identifier either; it is immediate arithmetic from the display (5) that
    Corollary 3.7 is stated with.
    The lettered results are Theorem A (the depth-K schema, Theorems 3.5 and
    3.6), Theorem B (the closed-form family on ε, Corollaries 3.7 and 3.8),
    Theorem C (the escape rate, Theorem 4.4), Theorem D (what the scheme can and
    cannot decide: Theorem 5.5, Theorem 5.7, and Theorem 6.3 with Corollary 6.4)
    and Theorem E (the ranked frontier, Theorem 7.1).
    Forty-one declarations are compared by comparator2.json. They are the
    statements of the paper that speak about real numbers and windows: all of §3,
    Theorem 4.4 row one with the nine rows of Table 1 and Corollary 4.5,
    Theorems 5.2, 5.5 and 5.10, Theorem 6.3 in both its forms, and all four forms
    of Theorem 7.1. Three groups are proved but deliberately not compared,
    because their statements quantify over the certificate format itself —
    Z32.BlockCert.Cert together with its Bool-valued checker Cert.ok — rather
    than over reals: Theorem 4.2 with Proposition 4.3(ii) and Theorem 4.4 row
    two; Theorems 5.6, 5.7, 5.8 and Corollary 5.9; Corollary 6.4 and Example 6.5.
    Restating those against Mathlib alone would mean re-declaring several hundred
    lines of the decision procedure inside Challenge2.lean, i.e. inside the one
    file the challenge exists to keep auditable; their consequences on concrete
    sets are compared instead. Challenge2.lean says so, entry by entry.
    The certificates behind the "computed" rows — the nine unranked ones of
    Table 1, the five closed-endpoint ones of Theorem 5.10, and the rank-
    stratified certTwoSeven of Theorem 7.1 (funnel depth 15, 166 blocks in 32
    rank strata, over D = 7·3¹⁵) — are each a `Cert.ok = true := by decide`, so
    the comparator's kernel replay re-evaluates every one from its raw integer
    data on a fresh environment, with no .olean loaded and no appeal to the C and
    Python engines that discovered them.
    Not formalized, and delimited as such in the paper: the measurements. Remark
    6.6 records what the greedy interval-by-interval search of [Ste26] reaches
    when restarted from its 240-interval grid — unions of total length 179/240,
    3/4 and 181/240 = 0.754167…, at depth 29 with 2801 blocks — and states in the
    same breath that these are search output, far too large to verify inside the
    formalization, and that nothing later depends on them. So is the count in §7
    of how many of the 236 frontier positions the rank-stratified criterion
    certifies (213, against fourteen for the unranked search), and the census of
    531 292 orbits of period at most 14 at the base 3/2 that Remark 6.6 reads
    Theorem 5.8 off.
