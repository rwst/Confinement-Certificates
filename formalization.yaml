version: "v0.4"

project:
  name: "Confinement certificates for powers of rational numbers modulo one"
  description: >-
    A Lean 4 / Mathlib development of a paper on the emptiness theory of the sets
    Z_{p/q}(s, s+t) = {ξ > 0 : {ξ(p/q)ⁿ} ∈ [s, s+t) for all n ≥ 0}, the generalized
    Z-numbers of Flatto, Lagarias and Pollington, at and beyond the window length
    1/p.
    The paper introduces block certificates --- finite integer
    witnesses, rechecked from scratch by the Lean proof kernel, whose soundness rests on
    the aperiodicity lemma alone --- and uses them to pass the length-$1/p$ line:
    $\Zset_{3/2}(1/6,13/24)=\emptyset$ (window length $3/8>1/3$),
    $\Zset_{3/2}(961/3600,2427/3600)=\emptyset$ (length $733/1800$), and explicit
    unions of total length up to $17/24$, against $20/39$ in print. The
    closed-interval union statement of Dubickas is replicated exactly as printed;
    no $\xi\ne0$ keeps $\|\xi(3/2)^{n}\|<1/5$ for every $n$, with $\|\cdot\|$ the
    distance to the nearest integer; and thirty windows of length $1/p$ are
    certified at five bases in the regime $p>q^{2}$ that Dubickas leaves open.
    There is no sorry anywhere outside the deliberate placeholders in
    Challenge.lean, no project-defined axiom, and no native_decide: every block
    certificate is discharged by `c.ok = true := by decide`, i.e. by kernel
    reduction of integer arithmetic on the certificate's raw data.
  authors:
    # Contributor roles for the formalization, not a bibliographic byline; the
    # paper's byline is recorded under sources.
    - "Ralf Stephan (direction, review, paper author)"
    - "Claude Code, claude-fable-5 (mathematical discovery, paper drafting)"
    - "Claude Code, claude-opus-4-8 (formalization)"
  license: "CC0-1.0"
  responsible_maintainers:
    - "Ralf Stephan"

repository:
  role: substantive-development

classification:
  arxiv: [math.NT, math.DS]
  msc2020: ["11J71", "11K06", "37B10"]

status:
  scope: >-
    Complete for every statement of the paper: Appendix A of the paper is a table
    of every statement with its Lean identifier, its file and its status, and
    every row is proved at std3 — no sorry, no cited axiom admitted as an axiom,
    no natively compiled decision procedure. The lettered results are Theorem A
    (the residue corollary, Theorem 5.3), Theorem B (the single windows,
    Theorems 7.8 and 7.15), Theorem C (the unions, Theorems 7.11, 7.12 and 7.9)
    and Theorem D (the nearest-integer family, Theorem 7.14); the two classical
    pillars are Theorem 4.2 ([FLP95] Cor. 1.4a) and Theorems 6.8/6.9
    ([Dub09AA] Thm. 1 and its Z-set forms); the regime p > q² is Theorems 7.16
    and 7.17. All of these are among the twenty-four compared declarations. The
    forty block certificates behind them — the ten of Table 2 and the thirty of
    Table 3 — are each a `Cert.ok = true := by decide`, so the comparator's kernel
    replay re-evaluates every one from its raw integer data on a fresh
    environment, with no .olean loaded and no appeal to the C and Python engines
    that discovered them.
    Not formalized, and delimited as such in the paper: the atlas as a whole. The
    sweeps of Z32/README.md, the sharpness of the engine frontier (that nothing is
    certified at any position above length 1467/3600), the λ and dimension columns,
    and the two search records past the kernel — a certificate at 43/60 (funnel
    depth 20, 433 blocks) and one at 0.7417 (240 cells, 3783 surviving components
    at depth 30, merging to 2512 blocks) — are engine output, not theorems. So is
    the negative evidence: that no certificate of this family exists for the arc
    ‖·‖ < 21/100 within funnel depth 60, nor for the closed form of the c = 1/5
    set; and that the (4,3) scan found nothing between lengths 70/240 and 94/240,
    which the paper itself rates weak evidence because that scan ran only to funnel
    depth 14 while the length-1/4 windows at that base already need depth 26.
