    # --- §6: the depth–size bound ---
    - source: "Theorem 6.3, one exponent at a time: (K + j + 1)δ + B ≥ 1"
      lean: "Z32.depth_size"
      module: "Challenge2 (statement), Solution2 / Z32.DepthSize (proof)"
      status: proved
      note: >-
        With the exact funnel Z32.funnel (T₀ = U, T_{k+1} = U ∩ f⁻¹(T_k)) and
        Z32.pre for f⁻¹. Expansion: |f⁻¹(S)| ≥ |S| by the factorisation
        f⁻¹ = slice_p ∘ fold_q (Z32.pre_eq_slice_fold), so the funnel loses at
        most δ per level (Prop. 6.1, Z32.one_le_volume_funnel_add).
    - source: "Theorem D(iii) (Thm. 6.3): 1 ≤ 2δ(K + 2 + log_{p/q} 2B)"
      lean: "Z32.depth_size_logb"
      module: "Challenge2 (statement), Solution2 / Z32.DepthSize (proof)"
      status: proved
      note: >-
        Expansion against contraction: past depth K an unranked certificate with
        B blocks confines the funnel to B intervals of diameter (q/p)^j
        (Prop. 6.2), and optimising in j gives the bound. Stated for an arbitrary
        measurable U with a covering hypothesis, so it does not mention Cert;
        the certificate instance Z32.BlockCert.cert_depth_size and Corollary 6.4
        do, and are not compared.

