    - source: "Theorem C (Thm. 7.11): a certified-empty union of total length 7/12"
      lean: "Z32.union_seven_twelfths_empty"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: "Certificate certUnion712: four intervals, funnel depth 7, a single block."
    - source: "Theorem C (Thm. 7.11): a certified-empty union of total length 2/3"
      lean: "Z32.union_two_thirds_empty"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: >-
        Certificate certUnion23: five intervals, funnel depth 9, twelve blocks.
