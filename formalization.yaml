        than found by the search.
    - source: "Theorem D (Thm. 7.14): ‖ξ(3/2)ⁿ‖ ≥ 1/5 for infinitely many n, for every ξ ≠ 0"
      lean: "Z32.not_forall_abs_sub_round_lt_fifth"
