    # --- §5: completeness and the obstruction ---
    - source: "Theorem 5.2 (determinism): at most one successor in [0,1) with denominator coprime to q"
      lean: "Z32.step_unique"
      module: "Challenge2 (statement), Solution2 / Z32.CertComplete (proof)"
      status: proved
      note: >-
        With Z32.HasDenom and Z32.CoprimeDenom. The arithmetic content: the q
        carries admissible at a point of [0,1) are q consecutive integers, and
        exactly one keeps the denominator coprime to q — so the recurrent part
        of the model dynamics is a map, not a relation. It is what makes the
        branching hypothesis of Theorem 5.5 automatic.
    - source: "Theorem D(i) (Thm. 5.5): a finite hold set forces the verdict, with no certificate in sight"
      lean: "Z32.holdSet_finite_imp"
      module: "Challenge2 (statement), Solution2 / Z32.CertComplete (proof)"
      status: proved
      note: >-
        With Z32.holdSet of Definition 5.1. The converse half of the soundness
        theorem [Ste26, Thm. 7.2]: soundness says a certificate forces the
        verdict, completeness says the class on which a certificate can exist
        already forces it, with no hypothesis on how the held orbits are
        arranged. What remains unformalized on this side is the production of
        certificate data from a finite hold set, which is combinatorics of
        interval lists rather than dynamics and is what the search program does.
    - source: "Theorem 5.10, first entry: the closed two-cell arc [0, 1/5] ∪ [4/5, 1]"
      lean: "Z32.BlockCert.two_cell_fifth_closed"
      module: "Challenge2 (statement), Solution2 / Z32.CertComplete (proof)"
      status: proved
      note: >-
        Certificate certTwoCellFifthClosed: funnel depth 1, four blocks in two
        rank strata — the 2-cycle {1/5, 4/5} at rank 0, the two large intervals
        at rank 1. Exactly the configuration Corollary 5.9 shows an unranked
        certificate cannot have, the closed arc's hold set being infinite
        (Z32.twoCellPt, the backward chain (1/5)(2/3)^k). Remark 5.12 records
        that the statement itself is subsumed by [Ste26, Thm. 7.14]; the entry is
        kept for the certificate.
    - source: "Theorem 5.10: the closed [1/6, 13/24]"
      lean: "Z32.BlockCert.sixth_3_8_closed"
      module: "Challenge2 (statement), Solution2 / Z32.CertComplete (proof)"
      status: proved
      note: "Certificate certWindow38Closed; the flagship window with its right endpoint."
    - source: "Theorem 5.10: the closed [961/3600, 2427/3600]"
      lean: "Z32.BlockCert.frontier_closed"
      module: "Challenge2 (statement), Solution2 / Z32.CertComplete (proof)"
      status: proved
      note: "Certificate certFrontierClosed: funnel depth 13, 14 blocks in 13 rank strata."
    - source: "Theorem 5.10: the closed [1/3, 5/8] at the base 4/3"
      lean: "Z32.BlockCert.four_three_closed"
      module: "Challenge2 (statement), Solution2 / Z32.CertComplete (proof)"
      status: proved
