    - source: "Corollary 3.11, depth 2 as an interval of positions: s ∈ [8/585, 4/117]"
      lean: "Z32.ZSet_five_two_depth_two_interval"
      module: "Challenge2 (statement), Solution2 / Z32.DepthKSchema (proof)"
      status: proved
      note: "Emptiness for all real s in an interval that the depth-one layer could not reach."

    # --- §4: the escape rate ---
    - source: "Theorem C (Thm. 4.4) row one: escape within ℰ(K+2, X, L) steps for a schema position"
      lean: "Z32.exists_fract_notMem_le_of_certifiedK"
      module: "Challenge2 (statement), Solution2 / Z32.EscapeBound (proof)"
      status: proved
      note: >-
        With the budget Z32.escapeSteps = A + 1 + ⌈log_q(X(p/q)^A + 1)⌉ +
        ⌈log_{p/q}(q/L)⌉ of Definition 4.1, at A = K + 2 and offset δ = 0. The
        Z-set form of Z32.exists_escape_le_of_certifiedK, which is stated in the
        window coordinate. Both logarithms are necessary; Remark 4.6 gives the
