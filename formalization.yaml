fidelity:
  divergences: >-
    The formalization follows the paper's own proofs; where it deviates, it
    deviates in the direction the paper records. In §2 the growth bound
    (Prop. 2.3) is applied with C = p rather than the C = 2p of [Dub09AA] §3,
    because the formalization proves the sharper alphabet bound 0 ≤ sₙ ≤ p under
    the confinement hypothesis (Rem. 6.3), giving the growth constant c = |x₀| + p.
    The aperiodicity lemma (Lem. 2.4) follows [DN05] in its use of the expanding
    affine map but closes with a direct divisibility argument instead of reducing
    to [DN05, Lem. 1], and keeps the liberalization ξ ≠ 0 noted in [Dub09AA] in
    place of the ξ > 0 of [DN05]. In §6, only one direction of the classical
    Sturmian equivalence is formalized (Lem. 6.1), and by a shorter route than the
    balance argument of [Lot02] — through uniqueness of the right special factor —
    with the matching Morse–Hedlund floor proved in ForMathlib; the alphabet lemma
    carries the explicit k = ⌈(p−q)s − q/p⌉ where [Dub09AA, Thm. 3] says "for some
    k ∈ ℤ"; and the endgame replaces the extraction of mth roots by Bernoulli's
    inequality, to the same effect. The Z-set forms quantify over every real s,
    irrational positions included, since Z_{p/q} is defined by the window
    [s, s+1/p) itself and not by its reduction modulo one, while the confinement
    theorem behind them (Thm. 6.7) is stated for 0 ≤ s < 1 as in the source.
    In §7 the Lean text follows Algorithm 1 line by line, with two differences
    that serve the kernel's evaluator and are recorded as cosmetic in Rem. 7.5:
    each max and min is expanded into the disjunction of its two comparisons
    (leMax, minLe), because the order-theoretic max on ℤ unfolds through
    LinearOrder projections the evaluator does not reduce well, and the flipped
    endpoint relation ≼κ̄ is implemented as its own relation rather than as a
    negation, which is the same Boolean. Theorem D is certified for the two-cell
    set [0, 1/5) ∪ [4/5, 1), which contains {y : ‖y‖ < 1/5} — the two differ only
    at y = 4/5 — so the named statement follows a fortiori; the closed form of the
    same set carries no certificate, exactly as Rem. 7.10 predicts.
    The lettering used throughout is the paper's — A (residues), B (single
    windows), C (unions), D (nearest integer). The docstrings of Challenge.lean
    predate the paper's relettering and called the residue corollary "Theorem C"
    and the windows "Theorem A"; they were brought into line on 2026-08-24, a
    change of comments only, since what comparator matches are the statements. The
    letters A and B also occur in Z32/README.md for two no-go results about the
    search engines; those are unrelated to the paper's lettered theorems. Lemma
    names follow the development, not the paper's numbering.

sources:
  - title: "Confinement certificates for powers of rational numbers modulo one"
    authors: ["Ralf Stephan"]
    type: paper
    id: "https://doi.org/10.13140/RG.2.2.36190.19520"
    location: "Theorems A, B, C, D; Theorems 4.2, 5.3, 6.8, 6.9, 7.8, 7.9, 7.11, 7.12, 7.14, 7.15, 7.16, 7.17"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The source of record. Paper and formalization come from the same
      collaboration and were developed together; Appendix A of the paper indexes
      every statement by Lean identifier, file and status, including the
      load-bearing ones that are not separately compared. The twenty-four compared
      declarations are the lettered theorems, the two classical pillars and the
      p > q² table. Novelty is recorded as unknown: the paper positions each entry
      against the printed record it could locate ([FLP95], [Bug04], [Dub09AA],
      [Dub08], [KK17], [Aki08], [Dub10]) but no systematic prior-art gate is
      documented in this repository, and the residue corollary is described there
      as folklore-grade and merely not found stated.

  - title: "On the range of fractional parts {ξ(p/q)ⁿ}"
    authors: ["Leopold Flatto", "Jeffrey C. Lagarias", "Andrew D. Pollington"]
    type: paper
    location: "Acta Arith. 70 (1995), 125–147; (1.4), Thm. 1.4, Cor. 1.4a, Thms. 3.2, 3.4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Defines the sets Z_{p/q}(s, s+t) and proves the 1/p-spread theorem.
      Corollary 1.4a is Theorem 4.2 of the paper, regenerated rather than cited:
      Theorems 3.2 and 3.4 are proved in FLP/ZEmpty.lean and FLP/SurvivorFinite.lean,
      the case s = 0 credited there to Pollington is FLP.ZSet_empty_zero in
      FLP/ParamDensity.lean, and the escape witnesses of Table 1 are exact rational
      computations in Z32/EscapeCert.lean. FLP/ carries more than the paper uses:
      Theorem 1.4 itself is proved as FLP.spread_lower_bound, with the base-3/2
      case FLP.three_halves_spread, and neither is compared.

  - title: "Powers of a rational number modulo 1 cannot lie in a small interval"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "Acta Arith. 137 (2009), 233–239; Thms. 1 and 3, §2–§4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The second classical pillar, formalized in full in Z32/SmallInterval.lean as
      Z32.dubickas_theorem_1 and its Z-set forms, following the source's proof:
      confinement forces a two-letter carry word, the word is Sturmian, and p < q²
      is incompatible with Sturmian complexity. Nothing is assumed from it. Its
      §4 leaves the length-1/p statement open for p > q², which is the regime the
      thirty certificates of Theorem 7.17 live in.

  - title: "Integer parts of powers of rational numbers"
    authors: ["Arturas Dubickas", "Aivaras Novikas"]
    type: paper
    location: "Math. Z. 251 (2005), 635–648; Lem. 2"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The aperiodicity of the carry word — the single analytic input of the whole
      development, and the only thing the block-certificate soundness theorem
      rests on. Proved rather than cited, as Z32.not_isEventuallyPeriodic_carry in
      Z32/DubickasWord.lean, so no certified statement carries a literature axiom.

  - title: "Algebraic Combinatorics on Words"
    authors: ["M. Lothaire"]
    type: book
    location: "Encyclopedia of Mathematics and its Applications 90, Cambridge University Press, 2002; Prop. 2.1.3, Thm. 2.1.5"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      The bispecial criterion for Sturmian words that [Dub09AA] §2 quotes. Only the
      direction the proof needs is formalized, in
      ForMathlib/Combinatorics/Sturmian.lean, and by a shorter route than the
      source's balance argument.

  - title: "Symbolic dynamics"
    authors: ["Marston Morse", "Gustav A. Hedlund"]
    type: paper
    location: "Amer. J. Math. 60 (1938), 815–866"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      The complexity floor p(w, m) ≥ m + 1 for aperiodic words, which the Sturmian
      criterion consumes. Proved in ForMathlib/Combinatorics/InfiniteComplexity.lean
      and ForMathlib/Combinatorics/Sturmian.lean, not cited.

  - title: "On the powers of 3/2 and other rational numbers"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "Math. Nachr. 281 (2008), no. 7, 951–958; Cor. 1.2, Thm. 1.3"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The printed record for empty unions: no ξ has all of {ξ(3/2)ⁿ} in the closed
      union [8/39, 18/39] ∪ [21/39, 31/39], of total length 20/39. Replicated
      exactly as printed — in the closed convention, which is the stronger
      statement and the one entry needing the rank stratification of condition (D)
      — as Z32.dubickas_2008_cor_1_2, by a certificate of the development's own
      scheme rather than by the source's argument. Theorem 7.12 exceeds its total
      length by a factor 1.38.

  - title: "Cellular automata and powers of p/q"
    authors: ["Jarkko Kari", "Johan Kopra"]
    type: paper
    location: "RAIRO Theor. Inform. Appl. 51 (2017), 191–204; Cor. 4.8, Thm. 5.9, Prob. 6.1"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The opposite direction, and the reason total length decides nothing: their
      nonempty confinement union has total length 2/3, exactly that of one of the
      empty unions certified here and more than another. Their Problem 6.1 asks
      for explicit empty unions of total length 1 − ε for every ε; the entries
      here are records on that curve, not a solution of it. Nothing is assumed
      from the paper, and Z32/reproduce.sh runs their Cor. 4.8 union as a negative
      control that the generator must refuse.

  - title: "Mahler's Z-number and 3/2 number systems"
    authors: ["Shigeki Akiyama"]
    type: paper
    location: "Unif. Distrib. Theory 3 (2008), no. 2, 91–99; Thms. 2.4, 2.5, Conj. 1.4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Nonempty confinement sets of arbitrarily small measure when p > q². No
      tension with the thirty certificates of Theorem 7.17: those sets are
      Cantor-type unions, not single windows of length 1/p — and they are exactly
      where the natural upgrade to all real positions fails, the element containing
      0 refusing to certify at every cover resolution tested. Separately, the M7
      measurement of Z32/README.md establishes that no block certificate of this
      family, at any product level, can prove Conjecture 1.4; that measurement is
      engine output, not a formalized statement.

  - title: "Linear mod one transformations and the distribution of fractional parts {ξ(p/q)ⁿ}"
    authors: ["Yann Bugeaud"]
    type: paper
    location: "Acta Arith. 114 (2004), 301–311; Cor. 1"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The intermediate step between [FLP95] and [Dub09AA] on the length-1/p line:
      emptiness for almost every position, and an enlarged explicit list. Not
      formalized and not used; Theorem 6.9 subsumes it at every position for
      p < q².

  - title: "On the fractional parts of powers of rational numbers"
    authors: ["Arturas Dubickas"]
    type: paper
    location: "Bull. Aust. Math. Soc. 82 (2010), 249–254"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Constructs ξ with ‖ξ(3/2)ⁿ‖ < 1/3 for every n, which is what makes
      Theorem D a threshold statement rather than an emptiness statement: the
      threshold for that family lies in [1/5, 1/3], and Theorem 7.14 moves the
      lower end from the 1/6 reachable by [Dub09AA] to 1/5.

  - title: "An unsolved problem on the powers of 3/2"
    authors: ["Kurt Mahler"]
    type: paper
    location: "J. Austral. Math. Soc. 8 (1968), 313–321"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      The origin of the sets: whether Z_{3/2}(0, 1/2) is empty. Nothing here
      touches it, and Remark 5.5 records why the residue corollary excludes the
      modulus m = 2 — its two cells are exactly that problem and its parity twin.

automation:
  methods:
    - method: agent
      models: ["claude-fable-5"]
      framework: "Claude Code"
      role: >-
        Mathematical discovery, and the drafting of the paper.
    - method: agent
      models: ["claude-opus-4-8"]
      framework: "Claude Code"
      role: >-
        Formalization and tooling.
    - method: manual
      models: []
      role: >-
        Direction, review, and authorship of the paper. The author chose the
        problem, set the targets and the hygiene gates (std3, no cited axiom, no
        native_decide), steered the work turn by turn, reviewed every statement
        against the paper, and takes sole responsibility for the mathematical
        content.
  spend_usd: "subscription-based usage ($100/month subscription; no separate API spend)"
  notes: >-
    Three independent kinds of check ship with the repository. First, the engines
    are cross-checked against each other: atlas.c (exact y-model, arbitrary
    unions), hold.c (θ-model, single windows) and gridcert.c (uniform cell SFT)
    are three implementations of the same pruning, and verify_atlas.py is a
    deliberately naive fourth in Python with exact Fraction arithmetic whose only
    purpose is to catch implementation error in the C engines. All arithmetic in
    every decision path is integer or exact-rational; no floating point occurs
    anywhere. Second, Z32/reproduce.sh regenerates every number quoted in
    Z32/README.md from scratch in about a minute (except the M6 controls, about an
    hour), with md5 checksums, and — the load-bearing part — re-runs gencert.py on
    each of the forty certificates and diffs the result against the definitions in
    Z32/BlockCert.lean and Z32/UnionRecord.lean, requiring them to be byte
    identical. The same script runs the generator against five sets known to be
    NONEMPTY in print ([KK17] Cor. 4.8, [Dub10], [Pol81], [Dub08] Thm. 1.3,
    [Cho80]) and requires it to refuse every one, in the default mode and in the
    strongest closed/ranked mode. Third, `lake test` runs leanprover/comparator,
    which re-derives the axiom list from a kernel replay of a fresh export of both
    the challenge and the solution. Wall time and hardware were not recorded,
    except for the union record of Theorem 7.12, whose kernel check alone costs
    about 100 seconds and 12 gigabytes; the development isolates it in
    Z32/UnionRecord.lean so that nothing else pays that. comparator.json names
    SolutionRecord rather than Solution, the record being among the statements it
    certifies, so a `lake test` run pays that cost once.

review:
  status: agent-reviewed
  reviewers:
    - "Ralf Stephan"
    - "aiXiv Official Agent (anonymous)"
  notes: >-
    The author directed the work and checked the statements against the paper.
    One external review, of v1.0 of aiXiv preprint aixiv.260808.000001
    (2026-08-08), by the platform's anonymous "Official Agent": rating 8, and no
    error identified in any statement or proof. Its four weaknesses are the
    narrow scope for a machine-learning venue, the undocumented certificate
    search, the absence of independent cross-validation, and dense exposition;
    two of them are answered by material the review did not consult, Appendix A
    of the paper being the requested theorem-to-Lean table and Z32/reproduce.sh
    the requested independent recheck of the certificates outside Lean. It is an
    agent review; no human referee has read the paper or the development.

limitations:
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound and
    nothing else. There is no sorry outside the deliberate placeholders in
    Challenge.lean, no project-defined axiom and no native_decide; every block
    certificate is discharged by `by decide`, so the comparator's kernel replay
    re-evaluates it from raw integer data. Challenge.lean restates exactly one
    definition, FLP.ZSet, and fixes no definition holes, so no compared statement
    can be hollowed out by a definition value supplied elsewhere. The
    block-certificate apparatus — Cert, Cert.ok, funnelOk, funcOk, the carry
    alphabet, the soundness theorem — does not appear in the challenge at all:
    every certified statement is phrased in Mathlib vocabulary alone, so the
    apparatus is quantified away before comparator sees a statement, and its
    correctness is rechecked in the same kernel replay rather than assumed.
  - >-
    Novelty is unknown, and no prior-art gate is documented in this repository.
    The residue corollary (Theorem A) is described in the paper as a folklore-grade
    consequence of [Dub09AA, Thm. 1] that the author could not find stated; what
    is new there is the verified proof object and the fact that the proof is
    independent of [Dub09AA], resting only on the five [FLP95] positions and an
    elementary covering. The union entries are records only against the explicit
    values the author could locate in print.
  - >-
    Not formalized: the atlas as a whole. The (position, length) sweeps, the
    sharpness of the frontier at L* ≈ 0.40722, the λ and dimension columns, the
    0.7417 search record, the M7 no-go measurement about [Aki08] Conjecture 1.4,
    and the negative results at c = 21/100 and at the base 4/3 are engine output,
    not theorems, and none of them is used by any proof. The certified entries are
    individual points on that map, not the map.
  - >-
    The kernel and the search part company at 17/24. Certificates exist at 43/60
    and at 0.7417 but have funnels three times and an order of magnitude wider
    than the one checked, and the one checked already costs about 12 gigabytes;
    coarsening a funnel's intermediate levels outward is sound and is the route to
    those entries, and has not been carried out. [KK17, Prob. 6.1] — explicit empty
    unions of total length 1 − ε for every ε — stays open, as does the
    all-positions length-1/p statement for p > q²: Table 3 is a finite list of
    rational windows, and the natural upgrade by a finite cover fails in practice,
    the fattened windows developing hundreds of surviving components, with the
    element containing 0 failing at every resolution tested — which is where
    [Aki08] puts its nonempty Cantor sets.
  - >-
    Mahler's problem stays open, and with it everything at the modulus m = 2 and
    at window length 1/2, where the engine returns the whole interval. The
    threshold of the nearest-integer family is pinned only to [1/5, 1/3].
  - >-
    The repository proves more than comparator.json compares. FLP/ carries the
    [FLP95] 1/3-spread theorem itself (FLP.spread_lower_bound,
    FLP.three_halves_spread), which the paper does not use; and six Z32 modules
    belong to other plans entirely — EscapeLadder.lean (the visit ladder below
    density), VisitDensity.lean (the V-rung grid and M6_iff_dyadic),
    ModelEntropy.lean (the φ_model ledger and its horseshoe certificates),
    DyadicOrbit.lean (the 2-adic shape of the ξ = 1 orbit), PairStatistics.lean
    (lag identities, window energies, the Weyl collapse) and BalanceVectors.lean
    (the level-w carry graph and the proved vacuity of every finite-resolution
    balance argument). All are std3 and sorry-free, none is named in
    comparator.json, and no compared statement depends on any of them.

alignment:
  namespace: "Z32"
  # FLP/ lives in namespace FLP (including the definition FLP.ZSet that the
  # certified statements mention) and the word-combinatorics infrastructure in
  # ForMathlib/ is in the root namespace.
  statements:
    # --- the twenty-four compared declarations ---
    - source: "Theorem 4.2 = [FLP95] Cor. 1.4a: Z_{3/2}(s, s+1/3) = ∅ at s = 0, 1/6, 1/3, 1/2, 2/3"
      lean: "Z32.FLP_cor_one_four_a"
      module: "Challenge (statement), Solution / Z32.EscapeCert (proof)"
      status: proved
      note: >-
        A kernel-checked replay of the finite computation indicated after
        [FLP95, Thm. 1.4]. The four escape witnesses of Table 1 are exact rational
        computations (Z32.escape_one_sixth and its three siblings); the fixed point
        s = 0 has no escape witness and goes through the endpoint analysis of
        FLP.ZSet_empty_zero, the case credited there to Pollington. The five
        positions receive a second, independent proof from Theorem 6.9, which
        shares only the definitions with this one.
    - source: "Theorem 6.8 = [Dub09AA] Thm. 1: the parts leave [s, s+1/p] infinitely often, 1 < q < p < q²"
      lean: "Z32.dubickas_theorem_1"
      module: "Challenge (statement), Solution / Z32.SmallInterval (proof)"
      status: proved
      note: >-
        Formalized in full, with both word-combinatorial inputs proved rather than
        cited. Stated for every real s and every N, in the arc form
        1/p < {ξ(p/q)ⁿ − s}, which is why the escape-ladder corollaries elsewhere
        in the repository need no endpoint case split.
    - source: "Theorem 6.9: Z_{p/q}(s, s+1/p) = ∅ for coprime 1 < q < p < q² and every real s"
      lean: "Z32.ZSet_eq_empty_of_lt_sq"
      module: "Challenge (statement), Solution / Z32.SmallInterval (proof)"
      status: proved
      note: >-
        The all-positions strengthening of Theorem 4.2 and of [Bug04, Cor. 1]. The
        position s ranges over all of ℝ, irrational positions included.
    - source: "Theorem 6.9 at (3,2): Z_{3/2}(s, s+1/3) = ∅ for every real s"
      lean: "Z32.ZSet_three_two_third_empty"
      module: "Challenge (statement), Solution / Z32.SmallInterval (proof)"
      status: proved
      note: "The base 3/2 qualifies since 3 < 4 = 2²."
    - source: "Theorem A (Thm. 5.3): for ξ > 0 and m ≥ 3 the residues ⌊ξ(3/2)ⁿ⌋ mod m are not eventually constant"
      lean: "Z32.residue_not_eventually_constant"
      module: "Challenge (statement), Solution / Z32.ResidueCapture (proof)"
      status: proved
      note: >-
        Proved from Theorem 4.2 and the covering Lemma 5.1 alone — the five
        windows of length 1/3 at spacing 1/6 cover every cell of every modulus
        m ≥ 3 — so it does not use [Dub09AA, Thm. 1], although that theorem would
        give it in one line. m = 2 is excluded deliberately: its two cells are
        Mahler's problem and its parity twin.
    - source: "Theorem A, infinitely-often form: past any index the residue changes again"
      lean: "Z32.exists_residue_change"
      module: "Challenge (statement), Solution / Z32.ResidueCapture (proof)"
      status: proved
      note: "The shift trick of Lemma 3.2 turns eventual confinement into confinement."
    - source: "Theorem A at ξ = 1: the residues of ⌊(3/2)ⁿ⌋ mod m do not stabilize"
      lean: "Z32.residue_not_eventually_constant_one"
      module: "Challenge (statement), Solution / Z32.ResidueCapture (proof)"
      status: proved
      note: "Stated separately so the reader need not instantiate ξ."
    - source: "Theorem B (Thm. 7.8): Z_{3/2}(1/6, 13/24) = ∅, a window of length 3/8 > 1/3"
      lean: "Z32.ZSet_three_two_sixth_3_8"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: >-
        Certificate certWindow38: D = 24·3⁸, funnel depth 8, three blocks,
        half-open. The published single-window line stops at length 1/p = 1/3, so
        this passes it. What the certificate rules out is a real ξ, not a model
        orbit: the surviving set of the interval map here is the nonempty 3-cycle
        4/19 → 6/19 → 9/19, and it is aperiodicity of the carry word that forbids
        a genuine orbit from following it.
    - source: "Theorem B (Thm. 7.8): Z_{3/2}(961/3600, 2427/3600) = ∅, length 733/1800 = 0.40722…"
      lean: "Z32.ZSet_three_two_frontier"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: >-
        Certificate certFrontier: funnel depth 13, two blocks. The longest window
        the search certifies at any position; that nothing certifies above
        1467/3600 is engine output and is not formalized.
    - source: "Theorem B (Thm. 7.8), eventual form: no ξ ≠ 0 is eventually confined to [1/6, 13/24)"
      lean: "Z32.not_eventually_mem_sixth_3_8"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: >-
