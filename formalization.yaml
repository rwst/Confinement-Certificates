    - source: "Theorem D (Thm. 7.14), cell form: no ξ ≠ 0 stays in [0, 1/5) ∪ [4/5, 1)"
      lean: "Z32.two_cell_fifth_empty"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
