    - source: "Theorem B (Thm. 7.15): Z_{4/3}(1/3, 5/8) = ∅, a window of length 7/24 > 1/4"
      lean: "Z32.ZSet_four_three_beyond_line"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: >-
        Certificate certFourThree, at a second base: six branches instead of four,
        funnel depth 5. Here 1/p = 1/4 is exactly where [Dub09AA, Thm. 1] stops,
        and it does apply at this base since 4 < 9 = 3².
    - source: "Theorem 7.9 = [Dub08] Cor. 1.2, as printed: the closed union [8/39,18/39] ∪ [21/39,31/39]"
      lean: "Z32.dubickas_2008_cor_1_2"
      module: "Challenge (statement), Solution / Z32.BlockCert (proof)"
      status: proved
      note: >-
        Certificate certDub08, the one entry in the closed convention and the one
        needing the rank stratification of condition (D): with the endpoints
        included the hold set acquires the 4-cycle through 18/39 = 6/13, and no
        partition with one outgoing edge per block exists at any depth examined
