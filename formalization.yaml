    - source: "Corollary 3.11, depth 3: {3s} ∈ [16/1015, 8/203]"
      lean: "Z32.ZSet_five_two_depth_three"
      module: "Challenge2 (statement), Solution2 / Z32.DepthKSchema (proof)"
